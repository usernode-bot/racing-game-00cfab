<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Racing game</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. npm run build compiles
       tailwind.config.js + styles/tailwind-input.css to public/tailwind.css
       on every image build, so the stylesheet is regenerated from THIS
       commit's markup every deploy. Class names must be whole literals in
       the source — a name assembled at runtime is invisible to the compiler. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path.
       Not conditional on calling a bridge API: it is also how the app
       ANSWERS the shell (offline launch, page colour reporting). -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 overflow-hidden select-none">

  <canvas id="game" class="fixed inset-0 w-full h-full touch-none"></canvas>

  <!-- In-run HUD. Pointer-events off so a drag passes through to the canvas. -->
  <div id="hud" class="fixed top-0 inset-x-0 flex justify-between items-start p-4 sm:p-6 pointer-events-none hidden">
    <div class="rounded-xl bg-zinc-900/70 px-4 py-2">
      <div class="text-xs uppercase tracking-wide text-zinc-500">Distance</div>
      <div id="distance" class="text-xl font-semibold font-mono">0 m</div>
    </div>
    <div class="rounded-xl bg-zinc-900/70 px-4 py-2 text-right">
      <div class="text-xs uppercase tracking-wide text-zinc-500">Speed</div>
      <div id="speed" class="text-xl font-semibold font-mono">86 km/h</div>
    </div>
  </div>

  <!-- Thumb pad: drag here to steer (left/right) and set speed (up/down).
       Hidden until a run starts, like the HUD. -->
  <div id="pad" class="fixed bottom-6 right-6 w-36 h-36 rounded-full bg-zinc-800/40 border border-zinc-600/50 touch-none hidden">
    <div id="pad-thumb" class="absolute left-1/2 top-1/2 w-12 h-12 rounded-full bg-violet-500/70 border border-violet-300/60" style="transform:translate(-50%,-50%)"></div>
  </div>

  <!-- Start screen, shown until the first run begins. -->
  <div id="start" class="fixed inset-0 flex items-center justify-center bg-zinc-950/60 p-4">
    <div class="max-w-sm w-full flex flex-col items-center gap-4 rounded-2xl border border-zinc-800 bg-zinc-900/90 p-8 text-center">
      <h1 class="text-2xl font-bold">Racing game</h1>
      <p id="start-msg" class="text-sm text-zinc-400 leading-relaxed">Drag the pad to steer: left and right steers, up and down sets your speed. Dodge the traffic and stay on the road.</p>
      <button id="start-btn" class="w-full rounded-xl bg-violet-600 hover:bg-violet-500 active:scale-95 transition-all px-5 py-3 font-semibold text-white">Start run</button>
    </div>
  </div>

  <!-- Game-over screen after a collision. -->
  <div id="over" class="fixed inset-0 hidden items-center justify-center bg-zinc-950/70 p-4">
    <div class="max-w-sm w-full flex flex-col gap-5 rounded-2xl border border-zinc-800 bg-zinc-900/90 p-8">
      <h2 class="text-2xl font-bold text-center">Crashed</h2>
      <div class="flex justify-center gap-10">
        <div class="text-center">
          <div class="text-xs text-zinc-500">Run</div>
          <div id="over-distance" class="text-xl font-semibold font-mono">0 m</div>
        </div>
        <div class="text-center">
          <div class="text-xs text-zinc-500">Best</div>
          <div id="over-best" class="text-xl font-semibold font-mono">0 m</div>
        </div>
      </div>
      <div>
        <h3 class="text-xs font-medium text-zinc-500 mb-2">Top runs</h3>
        <div id="board" class="space-y-1 text-sm"></div>
      </div>
      <p id="signin-hint" class="hidden text-xs text-center text-zinc-500">Sign in through Homeroom to save your runs.</p>
      <button id="restart-btn" class="rounded-xl bg-violet-600 hover:bg-violet-500 active:scale-95 transition-all px-5 py-3 font-semibold text-white">Restart</button>
    </div>
  </div>

  <!-- Map the bare `three` import to the build the app server serves from
       node_modules, then run the game as an ES module. -->
  <script type="importmap">
    { "imports": { "three": "/vendor/three.module.js" } }
  </script>
  <script type="module" src="/game.js"></script>
</body>
</html>
